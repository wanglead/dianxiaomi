{% extends "layout.html" %}
{% block title %}上架管理{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold text-gray-800">上架管理</h1>
  <div class="flex gap-2">
    <button onclick="showAddAccount()" class="px-4 py-2 text-sm rounded-lg bg-brand-600 text-white hover:bg-brand-700"><i class="fas fa-plus mr-1"></i>添加账号</button>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <!-- 选择商品 -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 lg:col-span-2">
    <h2 class="font-semibold text-gray-700 mb-3"><i class="fas fa-cube text-brand-500 mr-2"></i>选择待上架商品</h2>
    <div class="flex gap-2 mb-3">
      <input id="searchProducts" placeholder="搜索商品..." class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm">
    </div>
    <div id="selectableProducts" class="max-h-64 overflow-auto space-y-1 text-sm"><p class="text-gray-400">加载中...</p></div>
  </div>

  <!-- 上架配置 -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
    <h2 class="font-semibold text-gray-700 mb-3"><i class="fas fa-cog text-brand-500 mr-2"></i>上架配置</h2>
    <div class="space-y-3">
      <div><label class="text-sm text-gray-600 block mb-1">目标平台</label>
        <select id="listPlatform" class="w-full px-3 py-2 border rounded-lg text-sm">
          <option value="aliexpress">速卖通</option><option value="ozon">Ozon</option><option value="joom">Joom</option><option value="shopify">Shopify</option>
        </select></div>
      <div><label class="text-sm text-gray-600 block mb-1">上架方式</label>
        <select id="listMethod" class="w-full px-3 py-2 border rounded-lg text-sm">
          <option value="direct">直接上架</option><option value="dianxiaomi">通过店小秘</option>
        </select></div>
      <div><label class="text-sm text-gray-600 block mb-1">选择账号</label>
        <select id="listAccount" class="w-full px-3 py-2 border rounded-lg text-sm"><option value="">默认配置</option></select></div>
      <button onclick="startListing()" class="w-full py-2 text-sm rounded-lg bg-amber-600 text-white hover:bg-amber-700"><i class="fas fa-upload mr-1"></i>开始上架</button>
      <div id="listStatus" class="text-xs"></div>
    </div>
  </div>
</div>

<!-- 上架记录 -->
<div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 mt-6">
  <h2 class="font-semibold text-gray-700 mb-4"><i class="fas fa-history text-brand-500 mr-2"></i>上架记录</h2>
  <div id="listRecords" class="text-sm"><p class="text-gray-400">暂无记录</p></div>
</div>

<!-- 添加账号弹窗 -->
<div id="accountModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50" onclick="if(event.target===this)closeAccountModal()">
  <div class="bg-white rounded-2xl w-[480px] p-6 m-4" onclick="event.stopPropagation()">
    <h2 class="text-lg font-bold mb-4">添加平台账号</h2>
    <div class="space-y-3">
      <select id="accPlatform" class="w-full px-3 py-2 border rounded-lg text-sm"><option value="aliexpress">速卖通</option><option value="ozon">Ozon</option><option value="joom">Joom</option><option value="shopify">Shopify</option></select>
      <input id="accName" placeholder="账号名称" class="w-full px-3 py-2 border rounded-lg text-sm">
      <input id="accKey" placeholder="API Key" class="w-full px-3 py-2 border rounded-lg text-sm">
      <input id="accSecret" placeholder="API Secret / Password" class="w-full px-3 py-2 border rounded-lg text-sm">
      <input id="accStore" placeholder="Store Name（Shopify必填）" class="w-full px-3 py-2 border rounded-lg text-sm">
    </div>
    <div class="flex justify-end gap-2 mt-4"><button onclick="closeAccountModal()" class="px-4 py-2 text-sm rounded-lg border">取消</button><button onclick="saveAccount()" class="px-4 py-2 text-sm rounded-lg bg-brand-600 text-white">保存</button></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let selectedProductIds = [];

async function loadSelectableProducts() {
  try {
    const q = document.getElementById('searchProducts').value;
    const data = await api('/api/products?page_size=50&status=collected' + (q ? '&keyword='+q : ''));
    const el = document.getElementById('selectableProducts');
    if (!data.items?.length) { el.innerHTML = '<p class="text-gray-400 text-sm">暂无待上架商品</p>'; return; }
    el.innerHTML = data.items.map(p => '<label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer">' +
      '<input type="checkbox" value="' + p.id + '" onchange="toggleListingProduct(' + p.id + ', this.checked)">' +
      '<span class="flex-1 truncate">' + (p.title || '未命名') + '</span>' +
      '<span class="text-xs text-gray-400">¥' + (p.selling_price || p.original_price || 0) + '</span></label>').join('');
  } catch(e) { document.getElementById('selectableProducts').innerHTML = '<p class="text-red-400 text-sm">' + e.message + '</p>'; }
}
window.toggleListingProduct = (id, checked) => { if (checked) selectedProductIds.push(id); else selectedProductIds = selectedProductIds.filter(x => x !== id); };

async function loadAccounts() {
  try {
    const accounts = await api('/api/listing/accounts');
    const sel = document.getElementById('listAccount');
    sel.innerHTML = '<option value="">默认配置</option>' + accounts.map(a => '<option value="' + a.id + '">' + a.account_name + ' (' + a.platform + ')</option>').join('');
  } catch(e) {}
}

async function startListing() {
  if (!selectedProductIds.length) { setListStatus('请先选择商品', 'text-red-500'); return; }
  const platform = document.getElementById('listPlatform').value;
  const method = document.getElementById('listMethod').value;
  const accountId = document.getElementById('listAccount').value;
  setListStatus('正在上架 ' + selectedProductIds.length + ' 个商品...', 'text-brand-500');
  try {
    const r = await api('/api/listing/list', {method:'POST', body: JSON.stringify({product_ids: selectedProductIds, platform: platform, via_dianxiaomi: method === 'dianxiaomi', account_id: accountId ? parseInt(accountId) : null})});
    const success = r.results.filter(x => x.status === 'success').length;
    setListStatus('上架完成: ' + success + '/' + r.results.length + ' 成功', 'text-green-600');
    loadSelectableProducts();
  } catch(e) { setListStatus('上架失败: ' + e.message, 'text-red-500'); }
}
function setListStatus(msg, cls) { const el = document.getElementById('listStatus'); el.textContent = msg; el.className = 'text-xs ' + cls; }

window.showAddAccount = () => document.getElementById('accountModal').classList.remove('hidden');
window.closeAccountModal = () => document.getElementById('accountModal').classList.add('hidden');
window.saveAccount = async () => { await api('/api/listing/accounts', {method:'POST', body: JSON.stringify({platform: document.getElementById('accPlatform').value, account_name: document.getElementById('accName').value, api_key: document.getElementById('accKey').value, api_secret: document.getElementById('accSecret').value, store_name: document.getElementById('accStore').value})}); closeAccountModal(); loadAccounts(); };

document.getElementById('searchProducts').addEventListener('input', () => loadSelectableProducts());
loadSelectableProducts();
loadAccounts();
</script>
{% endblock %}
